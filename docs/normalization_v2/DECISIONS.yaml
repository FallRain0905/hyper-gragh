    depends_on: [W02, W03, W04]
    status: planned
  - id: W06
    title: Bounded judgement and shared request worker
    depends_on: [W03, W05]
    status: planned
  - id: W07
    title: Quantities and role-aware facts
    depends_on: [W03, W05, W06]
    status: planned
  - id: W08
    title: Incremental projections and atomic publication
    depends_on: [W03, W07]
    status: planned
  - id: W09
