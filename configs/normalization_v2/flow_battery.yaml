schema_version: registry-offline-v2.1
domain: flow_battery
description: 'Declarative identities for the flow-battery corpus.  Acid, ion, valence and membrane-model distinctions
  are explicit.  Legacy IDs that were renamed are preserved as redirect stubs; they are not separately indexed.

  '
roles:
- name: active_species
  description: Redox-active species in a flow battery.
- name: separator
  description: Ion-exchange membrane or separator.
- name: flow_battery_system
  description: Complete flow-battery system.
redirects:
  system:slfb: system:soluble_lead_acid_flow_battery
  active_species:vo_2_plus: species:vanadyl_ion
