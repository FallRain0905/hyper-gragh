schema_version: registry-offline-v2.1
domain: pfas
description: 'Declarative identities for the PFAS / piezocatalysis corpus.  Acid, anion and salt forms are separate
  identities; composites do not merge with their components; phase and sample variants stay below their parent concept.

  '
roles:
- name: target_contaminant
  description: PFAS target compound.
- name: water_matrix
  description: Water matrix or background solution.
- name: process
  description: Treatment process.
redirects:
