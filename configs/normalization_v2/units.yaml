schema_version: registry-offline-v2.1
domain: units
description: 'Explicit unit conversions.  Every dimension has one base unit and every
  factor is a decimal string so that conversion never depends on binary floating point.  Absolute
  and differential temperatures are separate dimensions: an offset belongs to the
  absolute scale, not to a difference.

  '
